services:
  - type: web
    name: dify-web
    region: frankfurt
    plan: standard
    healthCheckPath: /
    envVars:
      - key: CONSOLE_API_URL
        fromService:
          name: dify-api
          type: web
          envVarKey: INTERNAL_URL
      - key: APP_API_URL
        fromService:
          name: dify-api
          type: web
          envVarKey: INTERNAL_URL
      - key: NEXT_TELEMETRY_DISABLED
        value: "0"
      - key: TEXT_GENERATION_TIMEOUT_MS
        value: "60000"
      - key: SENTRY_DSN
        value: '-'
      - key: CSP_WHITELIST
        value: '-'
    image:
      url: langgenius/dify-web:0.10.2
    runtime: image

  - type: web
    name: dify-api
    region: frankfurt
    plan: standard
    runtime: image
    image:
      url: langgenius/dify-api:0.10.2
    envVars:
      - key: MODE
        value: api
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FILE_MAX_SIZE
        value: 20
      - key: DEBUG
        value: "false"
      - key: FLASK_DEBUG
        value: "false"
      - key: SECRET_KEY
        sync: false
      - key: INIT_PASSWORD
        sync: false
      - key: DEPLOY_ENV
        value: production
      - key: CHECK_UPDATE_URL
        value: https://meetgeorge.co.uk
      - key: OPENAI_API_BASE
        value: https://api.openai.com/v1
      - key: MIGRATION_ENABLED
        value: "true"
      - key: FILES_ACCESS_TIMEOUT
        value: "300"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: APP_MAX_ACTIVE_REQUESTS
        value: "0"
      - key: DIFY_BIND_ADDRESS
