      - key: API_TOOL_DEFAULT_READ_TIMEOUT
        value: "60"
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: SQLALCHEMY_POOL_SIZE
