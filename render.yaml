      - key: POSITION_PROVIDER_INCLUDES
        value: ""
      - key: POSITION_PROVIDER_EXCLUDES
        value: ""
      - key: CSP_WHITELIST
        value: "-"
    disk:
      name: storage
      mountPath: /app/api/storage
      sizeGB: 10

